spring:
  application:
    name: sample07-config-driven-strategy
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:sample07_config_driven_strategy;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
